[package]
name = "arty-app"
description = "ARTY: manga and illustration painting workstation"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "arty"
path = "src/main.rs"

[features]
# Live/peak heap bytes in ARTY_BENCH output (plans/bench/B020).
heap-stats = []

[dependencies]
arty-brush.workspace = true
arty-core.workspace = true
arty-io.workspace = true
arty-pen.workspace = true
arty-render.workspace = true
arty-testkit.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
egui-phosphor.workspace = true
env_logger.workspace = true
log.workspace = true
png.workspace = true
rayon.workspace = true
rfd.workspace = true
serde.workspace = true
pollster = "0.4"

# Log file names (local time), Windows version for crash reports, Help menu links.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_SystemServices", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
arty-testkit.workspace = true
# Tests hold the IO thread with `Request::Pause`.
arty-io = { workspace = true, features = ["fault-injection"] }
skrifa = "0.44"

[lints]
workspace = true
